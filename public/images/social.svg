<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .bg { fill: #F5F4EC; }
      .wordmark { font-family: 'Sendspin Display', ui-sans-serif, system-ui, sans-serif; font-weight: 700; font-size: 36px; fill: #231C18; letter-spacing: -0.72px; }
      .beta { font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif; font-weight: 600; font-size: 16px; fill: #C8503F; }
      .h { font-family: 'Sendspin Display', ui-sans-serif, system-ui, sans-serif; font-weight: 700; font-size: 60px; letter-spacing: -1.5px; }
      .h-espresso { fill: #231C18; }
      .h-coral { fill: #E66756; }
      .sub { font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif; font-weight: 500; font-size: 22px; fill: #4A3F39; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="630"/>

  <!-- Brand wordmark -->
  <text x="80" y="118" class="wordmark">Sendspin</text>

  <!-- Preview pill -->
  <g transform="translate(80, 186)">
    <rect width="340" height="36" rx="18" fill="#FBE4DF"/>
    <text x="18" y="24" class="beta">Public preview · spec subject to change</text>
  </g>

  <!-- Headline -->
  <text x="80" y="318" class="h h-espresso">Whole-home audio,</text>
  <text x="80" y="380" class="h h-coral">without the lock-in.</text>

  <!-- Subtext -->
  <text x="80" y="458" class="sub">Music, art and light in microsecond sync.</text>
  <text x="80" y="490" class="sub">An open standard from the Open Home Foundation.</text>

  <!-- Hero room illustration, as on the homepage -->
  <image href="room-plate.png" x="660" y="101" width="520" height="433"/>
</svg>
